services:
  backend:
    build:
      context: ./monitoring-backend
      dockerfile: Dockerfile
    image: dashboard-service-backend:production
    container_name: dashboard-backend-production
    restart: always
    environment:
      - APP_ENV=production
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - dashboard_data_prod:/app/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      dashboard:
        aliases:
          - monitoring-backend

  dashboard:
    build:
      context: ./monitoring-frontend
      dockerfile: Dockerfile
      args:
        VITE_MONITORING_API_URL: ""
    image: dashboard-service:production
    container_name: dashboard-frontend-production
    ports:
      - "80:80"
    environment:
      - APP_ENV=production
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - dashboard

volumes:
  dashboard_data_prod:
    name: dashboard-service-data-production

networks:
  dashboard:
    name: dashboard-service-production
    external: true
