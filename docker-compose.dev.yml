services:
  backend:
    build:
      context: ./monitoring-backend
      dockerfile: Dockerfile
    image: dashboard-service-backend:development
    container_name: dashboard-backend-development
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - NODE_ENV=development
      - PORT=5000
    volumes:
      - dashboard_data_dev:/app/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      dashboard:
        aliases:
          - monitoring-backend

  dashboard:
    build:
      context: ./monitoring-frontend
      dockerfile: Dockerfile
      args:
        VITE_MONITORING_API_URL: ""
    image: dashboard-service:development
    container_name: dashboard-frontend-development
    ports:
      - "8080:80"
    environment:
      - APP_ENV=development
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - dashboard

volumes:
  dashboard_data_dev:
    name: dashboard-service-data-development

networks:
  dashboard:
    name: dashboard-service-development
    external: true
